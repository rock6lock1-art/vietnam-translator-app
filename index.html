<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="日本語をベトナム語に翻訳するシンプルな翻訳アプリです。" />
    <title>ことばの橋 | 日本語・ベトナム語翻訳</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b2a;
        background: #f3f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .page {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 64px 0 40px;
      }

      header {
        margin-bottom: 32px;
        text-align: center;
      }

      .ui-language-switch {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }

      .ui-language-switch button {
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid #dce6e0;
        border-radius: 0;
        background: white;
        color: #354d47;
        font-size: 0.8rem;
      }

      .ui-language-switch button:first-child { border-radius: 6px 0 0 6px; }
      .ui-language-switch button:last-child { border-radius: 0 6px 6px 0; }
      .ui-language-switch button[aria-pressed="true"] {
        border-color: #147b64;
        background: #147b64;
        color: white;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #187b64;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        letter-spacing: 0.02em;
      }

      .intro {
        margin: 12px 0 0;
        color: #61716d;
      }

      .translator {
        overflow: hidden;
        border: 1px solid #e1e9e4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(31 65 52 / 8%);
      }

      .language-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px 24px;
        border-bottom: 1px solid #edf1ee;
        color: #354d47;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .swap-button,
      .tool-button,
      .copy-button {
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid #dce6e0;
        background: white;
        color: #354d47;
        font-size: 0.78rem;
      }

      .swap-button:hover:not(:disabled),
      .tool-button:hover:not(:disabled),
      .copy-button:hover:not(:disabled) {
        background: #f1f6f3;
      }

      .tool-button:disabled { cursor: not-allowed; opacity: 0.45; }
      .arrow { color: #18846b; }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        min-width: 0;
        padding: 22px 24px 18px;
      }

      .panel + .panel {
        border-left: 1px solid #edf1ee;
        background: #fbfcfb;
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: #61716d;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .count { font-weight: 400; }
      .panel-tools { display: flex; align-items: center; gap: 8px; }

      textarea,
      .result {
        display: block;
        width: 100%;
        min-height: 210px;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #172b2a;
        font: inherit;
        font-size: 1.08rem;
        line-height: 1.75;
        overflow-wrap: anywhere;
        resize: vertical;
      }

      textarea::placeholder,
      .result.placeholder { color: #a5b0ac; }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px;
        border-top: 1px solid #edf1ee;
      }

      .hint {
        color: #73817d;
        font-size: 0.78rem;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #147b64;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background 120ms ease;
      }

      button:hover:not(:disabled) { background: #106650; }
      button:disabled { cursor: wait; opacity: 0.65; }

      .copy-button {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid #dce6e0;
        background: white;
        color: #354d47;
        font-size: 0.78rem;
      }

      .status {
        min-height: 1.5em;
        margin: 14px 2px 0;
        color: #61716d;
        font-size: 0.88rem;
      }

      .status.error { color: #a93232; }

      .privacy-note {
        margin: 24px 0 0;
        color: #73817d;
        font-size: 0.8rem;
        line-height: 1.7;
        text-align: center;
      }

      @media (max-width: 600px) {
        .page { padding-top: 40px; }
        .panels { grid-template-columns: 1fr; }
        .panel { padding: 18px 20px 14px; }
        .panel + .panel {
          border-top: 1px solid #edf1ee;
          border-left: 0;
        }
        .language-bar {
          gap: 8px;
          padding: 14px 10px;
          font-size: 0.85rem;
        }
        .swap-button { padding: 0 8px; }
        textarea,
        .result { min-height: 140px; }
        .actions {
          align-items: flex-start;
          flex-direction: column;
          padding: 16px 20px;
        }
        .actions button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="ui-language-switch" id="ui-language-switch" role="group" aria-label="表示言語">
          <button class="ui-language-button" type="button" data-ui-language="ja" aria-pressed="true">日本語</button>
          <button class="ui-language-button" type="button" data-ui-language="vi" aria-pressed="false">Tiếng Việt</button>
        </div>
        <p class="eyebrow" id="eyebrow">JAPANESE → VIETNAMESE</p>
        <h1 id="app-title">ことばの橋</h1>
        <p class="intro" id="intro">日本語とベトナム語を翻訳します。</p>
      </header>

      <section class="translator" id="translator" aria-label="翻訳">
        <div class="language-bar" id="language-bar" aria-label="翻訳する言語">
          <span id="source-language">日本語</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span id="target-language">ベトナム語</span>
          <button class="swap-button" id="swap" type="button" aria-label="翻訳方向を入れ替える" title="翻訳方向を入れ替える">⇄</button>
        </div>

        <div class="panels">
          <div class="panel">
            <div class="panel-heading">
              <label id="source-heading" for="source">日本語</label>
              <span class="panel-tools">
                <button class="tool-button" id="listen" type="button" title="音声で入力" aria-label="音声で入力">音声入力</button>
                <span class="count" id="count">0 / 5000</span>
              </span>
            </div>
            <textarea id="source" maxlength="5000" placeholder="翻訳したい文章を入力してください" autocomplete="off"></textarea>
          </div>

          <div class="panel">
            <div class="panel-heading">
              <span id="target-heading">ベトナム語</span>
              <span class="panel-tools">
                <button class="tool-button" id="speak" type="button" title="翻訳結果を読み上げる" aria-label="翻訳結果を読み上げる" disabled>読み上げ</button>
                <button class="copy-button" id="copy" type="button" disabled>コピー</button>
              </span>
            </div>
            <div class="result placeholder" id="result" aria-live="polite">翻訳結果がここに表示されます</div>
          </div>
        </div>

        <div class="actions">
          <span class="hint">短い文章からお試しください</span>
          <button id="translate" type="button">翻訳する</button>
        </div>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="privacy-note" id="privacy-note">
        翻訳にはMyMemoryを利用します。入力した文章は翻訳のため外部サービスに送信されます。音声認識・読み上げの対応状況はブラウザによって異なります。
      </p>
    </main>

    <script>
      const els = {
        source: document.querySelector('#source'),
        result: document.querySelector('#result'),
        count: document.querySelector('#count'),
        translate: document.querySelector('#translate'),
        copy: document.querySelector('#copy'),
        swap: document.querySelector('#swap'),
        listen: document.querySelector('#listen'),
        speak: document.querySelector('#speak'),
        status: document.querySelector('#status'),
        sourceLanguage: document.querySelector('#source-language'),
        targetLanguage: document.querySelector('#target-language'),
        sourceHeading: document.querySelector('#source-heading'),
        targetHeading: document.querySelector('#target-heading'),
        eyebrow: document.querySelector('#eyebrow'),
        appTitle: document.querySelector('#app-title'),
        intro: document.querySelector('#intro'),
        uiLanguageSwitch: document.querySelector('#ui-language-switch'),
        languageBar: document.querySelector('#language-bar'),
        translator: document.querySelector('#translator'),
        privacyNote: document.querySelector('#privacy-note'),
        languageButtons: [...document.querySelectorAll('[data-ui-language]')],
      };

      const copy = {
        ja: {
          appTitle: 'ことばの橋',
          pageTitle: 'ことばの橋 | 日本語・ベトナム語翻訳',
          description: '日本語とベトナム語を翻訳するアプリです。',
          intro: '日本語とベトナム語を翻訳します。',
          translator: '翻訳',
          languagePair: '翻訳する言語',
          uiLanguage: '表示言語',
          swap: '翻訳方向を入れ替える',
          listen: '音声入力',
          listening: '認識中…',
          listenTitle: '音声で入力',
          recognitionUnsupported: 'このブラウザは音声認識に対応していません',
          speak: '読み上げ',
          speakTitle: '翻訳結果を読み上げる',
          copy: 'コピー',
          sourcePlaceholder: '翻訳したい{language}の文章を入力してください',
          resultPlaceholder: '翻訳結果がここに表示されます',
          hint: '短い文章からお試しください',
          translate: '翻訳する',
          translating: '翻訳中…',
          privacy: '翻訳にはMyMemoryを利用します。入力した文章は翻訳のため外部サービスに送信されます。音声認識・読み上げの対応状況はブラウザによって異なります。',
          listeningPrompt: '話してください。音声をテキストに変換します。',
          microphoneDenied: 'マイクの使用が許可されていません。ブラウザの設定をご確認ください。',
          recognitionFailed: '音声を認識できませんでした。もう一度お試しください。',
          recognitionStartFailed: '音声認識を開始できません。少し待ってから再度お試しください。',
          speechUnsupported: 'このブラウザは音声読み上げに対応していません。',
          speechPlaying: '翻訳結果を読み上げています。',
          emptyInput: '翻訳する文章を入力してください。',
          translationConnectionFailed: '翻訳サービスに接続できませんでした。',
          translationFailed: '翻訳できませんでした。時間をおいて再度お試しください。',
          translationProblem: '翻訳中に問題が発生しました。',
          translated: '翻訳しました。',
          copied: '翻訳結果をコピーしました。',
          copyFailed: 'コピーできませんでした。結果を選択してコピーしてください。',
        },
        vi: {
          appTitle: 'Cầu nối ngôn ngữ',
          pageTitle: 'Cầu nối ngôn ngữ | Dịch Nhật - Việt',
          description: 'Ứng dụng dịch giữa tiếng Nhật và tiếng Việt.',
          intro: 'Dịch giữa tiếng Nhật và tiếng Việt.',
          translator: 'Dịch',
          languagePair: 'Ngôn ngữ dịch',
          uiLanguage: 'Ngôn ngữ giao diện',
          swap: 'Đổi chiều dịch',
          listen: 'Nhập bằng giọng nói',
          listening: 'Đang nhận dạng…',
          listenTitle: 'Nhập bằng giọng nói',
          recognitionUnsupported: 'Trình duyệt này không hỗ trợ nhận dạng giọng nói',
          speak: 'Đọc bản dịch',
          speakTitle: 'Đọc bản dịch thành tiếng',
          copy: 'Sao chép',
          sourcePlaceholder: 'Nhập văn bản tiếng {language} cần dịch',
          resultPlaceholder: 'Bản dịch sẽ hiển thị ở đây',
          hint: 'Hãy thử với câu ngắn',
          translate: 'Dịch',
          translating: 'Đang dịch…',
          privacy: 'Ứng dụng sử dụng MyMemory để dịch. Văn bản bạn nhập sẽ được gửi đến dịch vụ bên ngoài. Khả năng nhận dạng giọng nói và đọc thành tiếng phụ thuộc vào trình duyệt.',
          listeningPrompt: 'Hãy nói để chuyển giọng nói thành văn bản.',
          microphoneDenied: 'Chưa được cấp quyền sử dụng micrô. Vui lòng kiểm tra cài đặt trình duyệt.',
          recognitionFailed: 'Không nhận dạng được giọng nói. Vui lòng thử lại.',
          recognitionStartFailed: 'Không thể bắt đầu nhận dạng giọng nói. Vui lòng đợi một chút rồi thử lại.',
          speechUnsupported: 'Trình duyệt này không hỗ trợ đọc văn bản thành tiếng.',
          speechPlaying: 'Đang đọc bản dịch thành tiếng.',
          emptyInput: 'Vui lòng nhập văn bản cần dịch.',
          translationConnectionFailed: 'Không thể kết nối với dịch vụ dịch thuật.',
          translationFailed: 'Không thể dịch. Vui lòng thử lại sau.',
          translationProblem: 'Đã xảy ra lỗi trong quá trình dịch.',
          translated: 'Đã dịch xong.',
          copied: 'Đã sao chép bản dịch.',
          copyFailed: 'Không thể sao chép. Hãy chọn bản dịch rồi sao chép.',
        },
      };

      const languages = {
        ja: { label: { ja: '日本語', vi: 'Tiếng Nhật' }, locale: 'ja-JP' },
        vi: { label: { ja: 'ベトナム語', vi: 'Tiếng Việt' }, locale: 'vi-VN' },
      };

      const state = {
        sourceCode: 'ja',
        uiLanguage: localStorage.getItem('uiLanguage') === 'vi' ? 'vi' : 'ja',
        recognitionActive: false,
        isTranslating: false,
        statusKey: '',
        statusIsError: false,
      };

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;

      function setStatus(key = '', isError = false) {
        state.statusKey = key;
        state.statusIsError = isError;
        els.status.textContent = key ? copy[state.uiLanguage][key] : '';
        els.status.classList.toggle('error', isError);
      }

      function syncCount() {
        els.count.textContent = `${els.source.value.length} / 5000`;
      }

      function updateLanguageLabels() {
        const sourceLabel = languages[state.sourceCode].label[state.uiLanguage];
        const targetLabel = languages[state.sourceCode === 'ja' ? 'vi' : 'ja'].label[state.uiLanguage];
        els.sourceLanguage.textContent = sourceLabel;
        els.sourceHeading.textContent = sourceLabel;
        els.targetLanguage.textContent = targetLabel;
        els.targetHeading.textContent = targetLabel;
        els.eyebrow.textContent = `${sourceLabel} → ${targetLabel}`;
        els.source.placeholder = copy[state.uiLanguage].sourcePlaceholder.replace('{language}', sourceLabel);
        if (recognition) recognition.lang = languages[state.sourceCode].locale;
      }

      function updateUi() {
        const strings = copy[state.uiLanguage];
        document.documentElement.lang = state.uiLanguage;
        document.title = strings.pageTitle;
        document.querySelector('meta[name="description"]').content = strings.description;
        els.appTitle.textContent = strings.appTitle;
        els.intro.textContent = strings.intro;
        els.translator.setAttribute('aria-label', strings.translator);
        els.uiLanguageSwitch.setAttribute('aria-label', strings.uiLanguage);
        els.languageBar.setAttribute('aria-label', strings.languagePair);
        els.swap.title = strings.swap;
        els.swap.setAttribute('aria-label', strings.swap);
        els.listen.textContent = state.recognitionActive ? strings.listening : strings.listen;
        els.listen.title = recognition ? strings.listenTitle : strings.recognitionUnsupported;
        els.listen.setAttribute('aria-label', strings.listenTitle);
        els.listen.disabled = !recognition || state.recognitionActive;
        els.speak.textContent = strings.speak;
        els.speak.title = strings.speakTitle;
        els.speak.setAttribute('aria-label', strings.speakTitle);
        els.copy.textContent = strings.copy;
        els.hint = document.querySelector('.hint');
        els.hint.textContent = strings.hint;
        els.translate.textContent = state.isTranslating ? strings.translating : strings.translate;
        els.translate.disabled = state.isTranslating;
        els.privacyNote.textContent = strings.privacy;

        const hasResult = !els.result.classList.contains('placeholder');
        els.speak.disabled = !hasResult;
        els.copy.disabled = !hasResult;

        if (els.result.classList.contains('placeholder')) {
          els.result.textContent = strings.resultPlaceholder;
        }

        els.languageButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.uiLanguage === state.uiLanguage));
        });

        updateLanguageLabels();
        if (state.statusKey) setStatus(state.statusKey, state.statusIsError);
      }

      function setUiLanguage(language) {
        state.uiLanguage = language;
        localStorage.setItem('uiLanguage', state.uiLanguage);
        updateUi();
      }

      function handleSpeechResult(event) {
        const transcript = Array.from(event.results)
          .map((item) => item[0].transcript)
          .join('');
        els.source.value = transcript.slice(0, 5000);
        syncCount();
      }

      if (!SpeechRecognition) {
        recognition = null;
      } else {
        recognition = new SpeechRecognition();
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.onstart = () => {
          state.recognitionActive = true;
          updateUi();
          setStatus('listeningPrompt');
        };
        recognition.onresult = handleSpeechResult;
        recognition.onerror = (event) => {
          setStatus(
            event.error === 'not-allowed' || event.error === 'service-not-allowed'
              ? 'microphoneDenied'
              : 'recognitionFailed',
            true,
          );
        };
        recognition.onend = () => {
          state.recognitionActive = false;
          updateUi();
        };
      }

      els.source.addEventListener('input', syncCount);

      els.swap.addEventListener('click', () => {
        const currentInput = els.source.value.trim();
        const currentOutput = els.result.classList.contains('placeholder') ? '' : els.result.textContent;

        state.sourceCode = state.sourceCode === 'ja' ? 'vi' : 'ja';

        if (currentInput) {
          els.source.value = currentOutput || '';
          els.result.textContent = currentInput;
          els.result.classList.remove('placeholder');
        } else {
          els.source.value = currentOutput || '';
          els.result.textContent = copy[state.uiLanguage].resultPlaceholder;
          els.result.classList.add('placeholder');
        }

        syncCount();
        updateUi();
        setStatus('');
      });

      els.listen.addEventListener('click', () => {
        if (!recognition) return;
        recognition.lang = languages[state.sourceCode].locale;
        try {
          recognition.start();
        } catch {
          setStatus('recognitionStartFailed', true);
        }
      });

      els.speak.addEventListener('click', () => {
        if (!('speechSynthesis' in window)) {
          setStatus('speechUnsupported', true);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(els.result.textContent);
        utterance.lang = languages[state.sourceCode === 'ja' ? 'vi' : 'ja'].locale;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        setStatus('speechPlaying');
      });

      els.translate.addEventListener('click', async () => {
        const text = els.source.value.trim();
        if (!text) {
          setStatus('emptyInput', true);
          els.source.focus();
          return;
        }

        state.isTranslating = true;
        updateUi();
        setStatus('');

        try {
          const params = new URLSearchParams({
            q: text,
            langpair: `${state.sourceCode}|${state.sourceCode === 'ja' ? 'vi' : 'ja'}`,
          });
          const response = await fetch(`https://api.mymemory.translated.net/get?${params}`);
          if (!response.ok) throw new Error('translationConnectionFailed');

          const data = await response.json();
          if (data.responseStatus !== 200 || !data.responseData?.translatedText) {
            throw new Error('translationFailed');
          }

          els.result.textContent = data.responseData.translatedText;
          els.result.classList.remove('placeholder');
          setStatus('translated');
        } catch (error) {
          const key = error instanceof Error && ['translationConnectionFailed', 'translationFailed'].includes(error.message)
            ? error.message
            : 'translationProblem';
          setStatus(key, true);
          if (els.result.classList.contains('placeholder')) {
            els.result.classList.add('placeholder');
          }
        } finally {
          state.isTranslating = false;
          updateUi();
        }
      });

      els.copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(els.result.textContent);
          setStatus('copied');
        } catch {
          setStatus('copyFailed', true);
        }
      });

      els.languageButtons.forEach((button) => {
        button.addEventListener('click', () => setUiLanguage(button.dataset.uiLanguage));
      });

      updateUi();
      syncCount();
    </script>
  </body>
</html>
