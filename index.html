<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="日本語をベトナム語に翻訳するシンプルな翻訳アプリです。" />
    <title>ことばの橋 | 日本語・ベトナム語翻訳</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b2a;
        background: #f3f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .page {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 64px 0 40px;
      }

      header {
        margin-bottom: 32px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #187b64;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        letter-spacing: 0.02em;
      }

      .intro {
        margin: 12px 0 0;
        color: #61716d;
      }

      .translator {
        overflow: hidden;
        border: 1px solid #e1e9e4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(31 65 52 / 8%);
      }

      .language-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px 24px;
        border-bottom: 1px solid #edf1ee;
        color: #354d47;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .swap-button,
      .tool-button,
      .copy-button {
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid #dce6e0;
        background: white;
        color: #354d47;
        font-size: 0.78rem;
        cursor: pointer;
      }

      .swap-button:hover:not(:disabled),
      .tool-button:hover:not(:disabled),
      .copy-button:hover:not(:disabled) {
        background: #f1f6f3;
      }

      .arrow {
        color: #18846b;
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        min-width: 0;
        padding: 22px 24px 18px;
      }

      .panel + .panel {
        border-left: 1px solid #edf1ee;
        background: #fbfcfb;
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: #61716d;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .count {
        font-weight: 400;
      }

      .panel-tools {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      textarea,
      .result {
        display: block;
        width: 100%;
        min-height: 210px;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #172b2a;
        font: inherit;
        font-size: 1.08rem;
        line-height: 1.75;
        overflow-wrap: anywhere;
        resize: vertical;
      }

      textarea::placeholder,
      .result.placeholder {
        color: #a5b0ac;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px;
        border-top: 1px solid #edf1ee;
      }

      .hint {
        color: #73817d;
        font-size: 0.78rem;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #147b64;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background 120ms ease;
      }

      button:hover:not(:disabled) {
        background: #106650;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .status {
        min-height: 1.5em;
        margin: 14px 2px 0;
        color: #61716d;
        font-size: 0.88rem;
      }

      .status.error {
        color: #a93232;
      }

      .privacy-note {
        margin: 24px 0 0;
        color: #73817d;
        font-size: 0.8rem;
        line-height: 1.7;
        text-align: center;
      }

      @media (max-width: 600px) {
        .page {
          padding-top: 40px;
        }

        .panels {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 18px 20px 14px;
        }

        .panel + .panel {
          border-top: 1px solid #edf1ee;
          border-left: 0;
        }

        .language-bar {
          gap: 8px;
          padding: 14px 10px;
          font-size: 0.85rem;
        }

        .swap-button {
          padding: 0 8px;
        }

        textarea,
        .result {
          min-height: 140px;
        }

        .actions {
          align-items: flex-start;
          flex-direction: column;
          padding: 16px 20px;
        }

        .actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow" id="eyebrow">日本語 → ベトナム語</p>
        <h1 id="app-title">ことばの橋</h1>
        <p class="intro">日本語とベトナム語を翻訳します。</p>
      </header>

      <section class="translator" aria-label="翻訳">
        <div class="language-bar" aria-label="翻訳する言語">
          <span id="source-language">日本語</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span id="target-language">ベトナム語</span>
          <button class="swap-button" id="swap" type="button" aria-label="翻訳方向を入れ替える" title="翻訳方向を入れ替える">
            ⇄
          </button>
        </div>

        <div class="panels">
          <div class="panel">
            <div class="panel-heading">
              <label id="source-heading" for="source">日本語</label>
              <span class="count" id="count">0 / 5000</span>
            </div>
            <textarea
              id="source"
              maxlength="5000"
              placeholder="翻訳したい日本語の文章を入力してください"
              autocomplete="off"
            ></textarea>
          </div>

          <div class="panel">
            <div class="panel-heading">
              <span id="target-heading">ベトナム語</span>
              <span class="panel-tools">
                <button class="copy-button" id="copy" type="button" disabled>コピー</button>
              </span>
            </div>
            <div class="result placeholder" id="result" aria-live="polite">
              翻訳結果がここに表示されます
            </div>
          </div>
        </div>

        <div class="actions">
          <span class="hint">短い文章からお試しください</span>
          <button id="translate" type="button">翻訳する</button>
        </div>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="privacy-note">
        翻訳にはMyMemoryを利用します。入力した文章は翻訳のため外部サービスに送信されます。
      </p>
    </main>

    <script>
      const source = document.querySelector('#source');
      const result = document.querySelector('#result');
      const count = document.querySelector('#count');
      const translateButton = document.querySelector('#translate');
      const copyButton = document.querySelector('#copy');
      const swapButton = document.querySelector('#swap');
      const status = document.querySelector('#status');
      const sourceLanguageLabel = document.querySelector('#source-language');
      const targetLanguageLabel = document.querySelector('#target-language');
      const sourceHeading = document.querySelector('#source-heading');
      const targetHeading = document.querySelector('#target-heading');
      const eyebrow = document.querySelector('#eyebrow');

      let sourceCode = 'ja';
      let isTranslating = false;

      const statusText = {
        emptyInput: '翻訳する文章を入力してください。',
        translated: '翻訳しました。',
        copied: '翻訳結果をコピーしました。',
        copyFailed: 'コピーできませんでした。結果を選択してコピーしてください。',
        translationConnectionFailed: '翻訳サービスに接続できませんでした。',
        translationFailed: '翻訳できませんでした。時間をおいて再度お試しください。',
        translationProblem: '翻訳中に問題が発生しました。',
      };

      function setStatus(message = '', isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function syncCount() {
        count.textContent = `${source.value.length} / 5000`;
      }

      function updateLanguageLabels() {
        const sourceLabel = sourceCode === 'ja' ? '日本語' : 'ベトナム語';
        const targetLabel = sourceCode === 'ja' ? 'ベトナム語' : '日本語';
        sourceLanguageLabel.textContent = sourceLabel;
        targetLanguageLabel.textContent = targetLabel;
        sourceHeading.textContent = sourceLabel;
        targetHeading.textContent = targetLabel;
        eyebrow.textContent = `${sourceLabel} → ${targetLabel}`;
        source.placeholder = `翻訳したい${sourceLabel}の文章を入力してください`;
      }

      function updateControls() {
        const hasResult = !result.classList.contains('placeholder');
        copyButton.disabled = !hasResult;
        translateButton.disabled = isTranslating;
        translateButton.textContent = isTranslating ? '翻訳中…' : '翻訳する';
      }

      source.addEventListener('input', () => {
        syncCount();
      });

      swapButton.addEventListener('click', () => {
        const previousValue = source.value.trim();
        const previousResult = result.textContent;

        sourceCode = sourceCode === 'ja' ? 'vi' : 'ja';
        updateLanguageLabels();

        if (previousValue) {
          source.value = previousResult && !result.classList.contains('placeholder') ? previousResult : '';
          result.textContent = previousValue || '翻訳結果がここに表示されます';
          result.classList.toggle('placeholder', !previousValue);
        } else {
          source.value = '';
          result.textContent = '翻訳結果がここに表示されます';
          result.classList.add('placeholder');
        }

        syncCount();
        setStatus('');
      });

      translateButton.addEventListener('click', async () => {
        const text = source.value.trim();
        if (!text) {
          setStatus(statusText.emptyInput, true);
          source.focus();
          return;
        }

        isTranslating = true;
        updateControls();
        setStatus('');

        try {
          const params = new URLSearchParams({
            q: text,
            langpair: `${sourceCode}|${sourceCode === 'ja' ? 'vi' : 'ja'}`,
          });

          const response = await fetch(`https://api.mymemory.translated.net/get?${params}`);
          if (!response.ok) {
            throw new Error('translationConnectionFailed');
          }

          const data = await response.json();
          if (data.responseStatus !== 200 || !data.responseData?.translatedText) {
            throw new Error('translationFailed');
          }

          result.textContent = data.responseData.translatedText;
          result.classList.remove('placeholder');
          setStatus(statusText.translated);
        } catch (error) {
          const key = error instanceof Error && ['translationConnectionFailed', 'translationFailed'].includes(error.message)
            ? error.message
            : 'translationProblem';

          setStatus(statusText[key], true);
          if (result.classList.contains('placeholder')) {
            result.classList.add('placeholder');
          }
        } finally {
          isTranslating = false;
          updateControls();
        }
      });

      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(result.textContent);
          setStatus(statusText.copied);
        } catch {
          setStatus(statusText.copyFailed, true);
        }
      });

      updateLanguageLabels();
      updateControls();
    </script>
  </body>
</html>
